<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heat Mixing Simulation</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #07070f;
      --panel:    #0d0d1a;
      --border:   #1e1e36;
      --text:     #b0b0cc;
      --text-dim: #555570;
      --accent:   #6666cc;
      --hot:      #ff9900;
      --cold:     #0099ff;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-size: 13px;
      overflow: hidden;
    }

    body { display: flex; }

    /* ── Canvas area ─────────────────────────────────────────────────── */
    #canvas-container {
      flex: 1 1 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      min-width: 0;
    }

    #canvas {
      display: block;
      cursor: crosshair;
      border-radius: 4px;
      box-shadow: 0 0 40px rgba(100, 100, 200, 0.14),
                  0 0 0 1px var(--border);
    }

    /* ── Sidebar ─────────────────────────────────────────────────────── */
    #sidebar {
      flex: 0 0 238px;
      background: var(--panel);
      border-left: 1px solid var(--border);
      padding: 14px 14px 10px;
      display: flex;
      flex-direction: column;
      gap: 13px;
      overflow-y: auto;
    }

    #sidebar h1 {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.06em;
      color: #8888cc;
    }

    /* ── Sections ─────────────────────────────────────────────────────── */
    .section { display: flex; flex-direction: column; gap: 7px; }

    .sec-title {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.10em;
      color: var(--text-dim);
    }

    /* ── Tool buttons ─────────────────────────────────────────────────── */
    .btn-row { display: flex; gap: 5px; }

    button {
      padding: 5px 10px;
      background: #121224;
      border: 1px solid var(--border);
      color: var(--text-dim);
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      transition: background 0.12s, color 0.12s, border-color 0.12s;
      user-select: none;
    }
    button:hover  { background: #1a1a30; color: var(--text); }
    button.active { background: #1e1e40; border-color: #5555aa; color: #aaaaff; }

    #tool-hot.active  { border-color: var(--hot);  color: var(--hot); }
    #tool-cold.active { border-color: var(--cold); color: var(--cold); }

    .tool-btn { flex: 1; }

    /* ── Sliders ─────────────────────────────────────────────────────── */
    .slider-row { display: flex; flex-direction: column; gap: 3px; }

    .slider-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .slider-header label { font-size: 11px; color: #9999bb; }

    .slider-val {
      font-size: 11px;
      font-family: 'Consolas', monospace;
      color: #8888ee;
      min-width: 38px;
      text-align: right;
    }

    input[type=range] {
      width: 100%;
      height: 4px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    /* ── Checkboxes ───────────────────────────────────────────────────── */
    .chk-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #9999bb;
      cursor: pointer;
      user-select: none;
    }
    .chk-row input[type=checkbox] { accent-color: var(--accent); cursor: pointer; }

    /* ── Colorbar ─────────────────────────────────────────────────────── */
    #colorbar-wrap { display: flex; flex-direction: column; gap: 4px; }

    #colorbar {
      width: 100%;
      height: 14px;
      border-radius: 3px;
      display: block;
    }

    .cb-labels {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: var(--text-dim);
    }

    /* ── Source list ──────────────────────────────────────────────────── */
    .source-list {
      display: flex;
      flex-direction: column;
      gap: 3px;
      max-height: 110px;
      overflow-y: auto;
    }

    .source-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 3px 6px;
      background: #0a0a18;
      border-radius: 3px;
      border: 1px solid #181828;
    }

    .source-dot {
      width: 9px; height: 9px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .source-label { font-size: 11px; flex: 1; }

    .src-remove {
      padding: 1px 5px;
      font-size: 13px;
      line-height: 1;
      border-color: #2a1a2a;
      color: #552255;
    }
    .src-remove:hover { color: #cc4444; border-color: #cc3333; background: #200808; }

    /* ── Footer hints ─────────────────────────────────────────────────── */
    .hint {
      font-size: 10px;
      color: var(--text-dim);
      line-height: 1.6;
    }

    #fps-display {
      font-size: 10px;
      color: #303048;
      text-align: right;
      margin-top: auto;
    }

    /* ── Divider ──────────────────────────────────────────────────────── */
    .divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 0;
    }

    /* ── Responsive: stack on small screens ──────────────────────────── */
    @media (max-width: 580px) {
      body            { flex-direction: column; }
      #sidebar        { flex: 0 0 auto; border-left: none; border-top: 1px solid var(--border); }
      #canvas-container { min-height: 60vh; }
    }
  </style>
</head>
<body>

  <div id="canvas-container">
    <canvas id="canvas"></canvas>
  </div>

  <div id="sidebar">
    <h1>Heat Mixing</h1>

    <!-- Tool selection -->
    <div class="section">
      <div class="sec-title">Tool</div>
      <div class="btn-row">
        <button id="tool-hot"   class="tool-btn active">Hot</button>
        <button id="tool-cold"  class="tool-btn">Cold</button>
        <button id="tool-erase" class="tool-btn">Erase</button>
      </div>
    </div>

    <!-- Source intensity -->
    <div class="section">
      <div class="sec-title">Source intensity</div>
      <div class="slider-row">
        <div class="slider-header">
          <label>Temperature</label>
          <span class="slider-val" id="val-src-temp">0.85</span>
        </div>
        <input type="range" id="sl-src-temp" min="0.05" max="1.0" step="0.05" value="0.85">
      </div>
    </div>

    <hr class="divider">

    <!-- Physics parameters -->
    <div class="section">
      <div class="sec-title">Physics</div>

      <div class="slider-row">
        <div class="slider-header">
          <label>Diffusion (α)</label>
          <span class="slider-val" id="val-alpha">0.15</span>
        </div>
        <input type="range" id="sl-alpha" min="0.01" max="0.8" step="0.01" value="0.15">
      </div>

      <div class="slider-row">
        <div class="slider-header">
          <label>Buoyancy (g)</label>
          <span class="slider-val" id="val-gravity">0.80</span>
        </div>
        <input type="range" id="sl-gravity" min="0" max="3.0" step="0.05" value="0.8">
      </div>

      <div class="slider-row">
        <div class="slider-header">
          <label>Cooling</label>
          <span class="slider-val" id="val-decay">0.002</span>
        </div>
        <input type="range" id="sl-decay" min="0" max="0.02" step="0.001" value="0.002">
      </div>

      <div class="slider-row">
        <div class="slider-header">
          <label>Vorticity</label>
          <span class="slider-val" id="val-vortconf">0.80</span>
        </div>
        <input type="range" id="sl-vortconf" min="0" max="3.0" step="0.05" value="0.8">
      </div>

      <div class="slider-row">
        <div class="slider-header">
          <label>Turbulence</label>
          <span class="slider-val" id="val-turb">0.00</span>
        </div>
        <input type="range" id="sl-turb" min="0" max="1.0" step="0.05" value="0.0">
      </div>
    </div>

    <hr class="divider">

    <!-- Visualisation -->
    <div class="section">
      <div class="sec-title">Visualisation</div>

      <label class="chk-row">
        <input type="checkbox" id="chk-vectors">
        Show flow vectors
      </label>

      <div class="slider-row">
        <div class="slider-header">
          <label>Arrow scale</label>
          <span class="slider-val" id="val-vec-scale">1.0</span>
        </div>
        <input type="range" id="sl-vec-scale" min="0.3" max="3.0" step="0.1" value="1.0">
      </div>

      <div class="slider-row">
        <div class="slider-header">
          <label>Vector density</label>
          <span class="slider-val" id="val-vec-spacing">12</span>
        </div>
        <input type="range" id="sl-vec-spacing" min="6" max="30" step="2" value="12">
      </div>

      <label class="chk-row">
        <input type="checkbox" id="chk-sources">
        Show source markers
      </label>
    </div>

    <hr class="divider">

    <!-- Colour scale -->
    <div id="colorbar-wrap">
      <div class="sec-title">Temperature scale</div>
      <canvas id="colorbar" height="14"></canvas>
      <div class="cb-labels">
        <span>Cold</span>
        <span>Ambient</span>
        <span>Hot</span>
      </div>
    </div>

    <!-- Active sources -->
    <div class="section">
      <div class="sec-title">Sources (<span id="source-count">0</span>)</div>
      <div class="source-list" id="source-list"></div>
    </div>

    <!-- Actions -->
    <div class="section">
      <div class="btn-row">
        <button id="btn-clear" style="flex:1">Clear field</button>
        <button id="btn-reset" style="flex:1">Reset all</button>
      </div>
      <button id="btn-pause" style="width:100%">Pause</button>
    </div>

    <div class="hint">
      Click / drag → place source<br>
      Right-click → remove nearest<br>
      Erase tool → remove on click
    </div>

    <div id="fps-display">-- fps</div>
  </div>

  <script src="js/simulation.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
